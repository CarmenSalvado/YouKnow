[project]
name = "metro-learning-backend"
version = "0.1.0"
description = "Prerequisite-graph learning plan API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "openai>=2.26,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.32,<1",
  "youtube-transcript-api>=1.2,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
